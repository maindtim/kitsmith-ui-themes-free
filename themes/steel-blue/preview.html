<!doctype html>
<html><head><meta charset="utf-8"><title>Kitsmith kit preview</title>
<link rel="stylesheet" href="kit.css">
<style>body{background:#171a2b;font:16px monospace;padding:24px}.row{display:flex;gap:10px;align-items:center;margin:12px 0}button{font:inherit}</style>
</head><body class="ks-cursor">
<div class="row" style="margin:0"><div class="ks-tab ks-selected">Items</div><div class="ks-tab">Skills</div></div>
<div class="ks-panel" style="width:450px">
<div>Inventory</div><hr class="ks-separator">
<div class="row"><div class="ks-slot" style="width:54px;height:54px"></div><div class="ks-slot" style="width:54px;height:54px"></div><div class="ks-slot" style="width:54px;height:54px"></div><div class="ks-frame" style="width:54px;height:54px"></div></div>
<div class="ks-bar"><div class="ks-fill" style="width:65%"></div></div>
<div class="row"><button class="ks-button ks-accent">Use</button><button class="ks-button">Drop</button><button class="ks-button" disabled>Locked</button></div>
</div>
<div class="row"><div class="ks-bubble">Hover and press the buttons.</div></div>
</body></html>
